name: luci-watch

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve upstream commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha=$(gh api repos/looong-cat/luci-app-netbird/commits/main --jq .sha)
          current=$(sed -n 's/^LUCI_COMMIT=//p' versions/luci-app-netbird.env | head -n 1)
          echo "COMMIT=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$current" ]; then
            echo "CHANGED=0" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test tools
        run: |
          set -eu
          scripts/install-test-deps.sh
      - name: Validate
        run: make lint test
      - name: Open PR
        if: steps.resolve.outputs.CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.resolve.outputs.COMMIT }}
        run: |
          set -eu
          branch="luci-update-${COMMIT}"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "PR already open for $branch"; exit 0
          fi
          git checkout -b "$branch"
          # The package version is whatever upstream pins: mirroring the
          # Makefile keeps the env in step with the ipk the SDK will build.
          gh api "repos/looong-cat/luci-app-netbird/contents/luci-app-netbird/Makefile?ref=${COMMIT}" \
            --jq .content | base64 -d > /tmp/luci-Makefile
          scripts/update-luci-env.sh --env-file versions/luci-app-netbird.env \
            --commit "$COMMIT" --makefile /tmp/luci-Makefile
          git config user.name "netbird-pkgs bot"
          git config user.email "bot@users.noreply.github.com"
          git add versions/luci-app-netbird.env
          git commit -m "chore(luci): update luci-app-netbird to ${COMMIT}"
          git push origin "$branch"
          gh pr create --title "chore(luci): update to ${COMMIT}" \
            --body "Upstream luci-app-netbird commit ${COMMIT}. Requires manual review and merge." \
            --base main --head "$branch"
