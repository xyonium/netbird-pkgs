name: luci-watch

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve upstream commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha=$(gh api repos/looong-cat/luci-app-netbird/commits/main --jq .sha)
          current=$(sed -n 's/^LUCI_COMMIT=//p' versions/luci-app-netbird.env | head -n 1)
          echo "COMMIT=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$current" ]; then
            echo "CHANGED=0" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test tools
        run: |
          set -eu
          scripts/install-test-deps.sh
      - name: Validate this repository
        run: make lint test
      # The PR this job opens is the only human gate on a package that runs as
      # root, and GITHUB_TOKEN-created PRs never trigger CI, so the new upstream
      # commit has to be built and verified here. The conclusion goes into the
      # PR body; a failure is reported, not hidden, and never auto-merged.
      - name: Validate the new upstream commit
        id: build
        if: steps.resolve.outputs.CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.resolve.outputs.COMMIT }}
        continue-on-error: true
        run: |
          set -eu
          . versions/luci-app-netbird.env
          scripts/install-openwrt-sdk.sh --version "$LUCI_SDK_VERSION" \
            --sha256 "$LUCI_SDK_SHA256" --dest "$RUNNER_TEMP/sdk"
          scripts/validate-luci-update.sh --sdk "$RUNNER_TEMP/sdk" \
            --workdir "$RUNNER_TEMP/validate" --summary "$RUNNER_TEMP/summary.md" \
            --commit "$COMMIT"
      - name: Note a failed build
        if: steps.resolve.outputs.CHANGED == '1' && steps.build.outcome != 'success'
        run: |
          set -eu
          f="$RUNNER_TEMP/summary.md"
          [ -f "$f" ] || printf '## LuCI build validation\n\n**FAILED** — the SDK build did not produce a summary.\n' > "$f"
          printf '\n> This PR must not be merged until the build above passes.\n' >> "$f"
      - name: Open PR
        if: steps.resolve.outputs.CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.resolve.outputs.COMMIT }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -eu
          branch="luci-update-${COMMIT}"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "PR already open for $branch"; exit 0
          fi
          git checkout -b "$branch"
          # The package version is whatever upstream pins: mirroring the
          # Makefile keeps the env in step with the ipk the SDK will build.
          gh api "repos/looong-cat/luci-app-netbird/contents/luci-app-netbird/Makefile?ref=${COMMIT}" \
            --jq .content | base64 -d > /tmp/luci-Makefile
          scripts/update-luci-env.sh --env-file versions/luci-app-netbird.env \
            --commit "$COMMIT" --makefile /tmp/luci-Makefile
          git config user.name "netbird-pkgs bot"
          git config user.email "bot@users.noreply.github.com"
          git add versions/luci-app-netbird.env
          git commit -m "chore(luci): update luci-app-netbird to ${COMMIT}"
          git push origin "$branch"
          # Quoted heredocs keep the markdown backticks literal, and the
          # commit is substituted afterwards so nothing needs escaping.
          {
            cat <<'HEADER'
          Upstream `luci-app-netbird` commit `@@COMMIT@@`.
          HEADER
            cat "$RUNNER_TEMP/summary.md"
            cat <<'FOOTER'

          ---

          Review the diff, then merge. Merging bumps `versions/luci-app-netbird.env`;
          the next release build picks it up.
          FOOTER
          } | sed "s|@@COMMIT@@|$COMMIT|" > /tmp/pr-body.md
          gh pr create --title "chore(luci): update to ${COMMIT}" \
            --body-file /tmp/pr-body.md --base main --head "$branch"
