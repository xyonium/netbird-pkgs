name: luci-watch

on:
  schedule:
    # Staggered from upstream-watch (0 3 * * 1): both touch versions/ on main,
    # and running them at the same moment makes one of them lose a push race.
    - cron: "30 3 * * 1"
  workflow_dispatch:

# The candidate build runs an untrusted upstream Makefile, so the read-only
# default lives here and the write permissions are granted per-job below.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.resolve.outputs.CHANGED }}
      commit: ${{ steps.resolve.outputs.COMMIT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve upstream commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha=$(gh api repos/looong-cat/luci-app-netbird/commits/main --jq .sha)
          current=$(sed -n 's/^LUCI_COMMIT=//p' versions/luci-app-netbird.env | head -n 1)
          echo "COMMIT=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$current" ]; then
            echo "CHANGED=0" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test tools
        run: |
          set -eu
          scripts/install-test-deps.sh
      - name: Validate this repository
        run: make lint test
      # Everything from here to the upload runs code from the upstream project.
      # This job holds no write permission, so a compromised upstream commit can
      # at worst fail the build.
      - name: Build the candidate with the real SDK
        if: steps.resolve.outputs.CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.resolve.outputs.COMMIT }}
        run: |
          set -eu
          scripts/install-sdk-deps.sh
          . versions/luci-app-netbird.env
          scripts/install-openwrt-sdk.sh --version "$LUCI_SDK_VERSION" \
            --sha256 "$LUCI_SDK_SHA256" --dest "$RUNNER_TEMP/sdk"
          if ! scripts/validate-luci-update.sh --sdk "$RUNNER_TEMP/sdk" \
              --sdk-version "$LUCI_SDK_VERSION" \
              --workdir "$RUNNER_TEMP/validate" --summary "$RUNNER_TEMP/summary.md" \
              --commit "$COMMIT"; then
            cat "$RUNNER_TEMP/summary.md" || true
            echo "::error::the candidate build failed; nothing was merged and no release was cut"
            exit 1
          fi
      - name: Upload the build conclusion
        if: steps.resolve.outputs.CHANGED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luci-summary
          path: ${{ runner.temp }}/summary.md
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: luci-summary
          path: ${{ runner.temp }}
      # No upstream code runs in this job; it only moves the two version files.
      - name: Merge the update and cut a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -eu
          branch="luci-update-${COMMIT}"
          # An existing PR must be refreshed, not skipped: its body carries the
          # build conclusion, and a previous run may have recorded a failure that
          # has since been fixed.
          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // ""')
          # gh pr list defaults to open PRs. A PR that was closed without merging
          # leaves the branch behind, and gh pr create then refuses ("a pull
          # request already exists"), turning this into a weekly failure. Leave
          # that decision to a human: say so and stop.
          if [ -z "$existing" ]; then
            closed=$(gh pr list --head "$branch" --state all --json number,state \
              --jq '[.[] | select(.state != "OPEN")][0].number // ""')
            if [ -n "$closed" ]; then
              echo "::error::PR #$closed for $branch was closed without merging; refusing to recreate it"
              exit 1
            fi
          fi
          git checkout -b "$branch"
          # The package version is whatever upstream pins: mirroring the
          # Makefile keeps the env in step with the ipk the SDK will build.
          gh api "repos/looong-cat/luci-app-netbird/contents/luci-app-netbird/Makefile?ref=${COMMIT}" \
            --jq .content | base64 -d > /tmp/luci-Makefile
          scripts/update-luci-env.sh --env-file versions/luci-app-netbird.env \
            --commit "$COMMIT" --makefile /tmp/luci-Makefile
          # The release tag is v<netbird>-r<pkg release> and sign-publish never
          # overwrites an existing tag, so a LuCI-only change needs its own
          # release number or the new package would never be published.
          scripts/bump-netbird-release.sh --env-file versions/netbird.env
          git config user.name "netbird-pkgs bot"
          git config user.email "bot@users.noreply.github.com"
          git add versions/luci-app-netbird.env versions/netbird.env
          git commit -m "chore(luci): update luci-app-netbird to ${COMMIT}"
          # The branch is owned by this job and named after the upstream commit,
          # so a previous run that died before opening its PR leaves a stale
          # branch behind. Replace it rather than failing on non-fast-forward.
          git push --force origin "$branch"
          # Quoted heredocs keep the markdown backticks literal, and the
          # commit is substituted afterwards so nothing needs escaping.
          {
            cat <<'HEADER'
          Upstream `luci-app-netbird` commit `@@COMMIT@@`.
          HEADER
            cat "$RUNNER_TEMP/summary.md"
            cat <<'FOOTER'

          ---

          Merged automatically by this workflow: the build above passed, so the
          PR is squash-merged, `versions/netbird.env` gets a new package release,
          and `build-release` is dispatched to publish it. The PR is kept as the
          audit trail for what shipped.
          FOOTER
          } | sed "s|@@COMMIT@@|$COMMIT|" > /tmp/pr-body.md
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md
            pr=$existing
          else
            gh pr create --title "chore(luci): update to ${COMMIT}" \
              --body-file /tmp/pr-body.md --base main --head "$branch" >/dev/null
            pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          fi
          # This PR is merged with nobody reviewing the diff, so bound what it may
          # carry: the two version files, nothing else. The build itself was
          # already verified above.
          changed=$(git diff --name-only "origin/main...$branch" | sort | tr '\n' ' ')
          want="versions/luci-app-netbird.env versions/netbird.env "
          [ "$changed" = "$want" ] \
            || { echo "::error::unexpected change set in the PR: $changed"; exit 1; }
          gh pr merge "$pr" --squash --delete-branch
          echo "merged PR #$pr"
          # The release is the point: merging the env alone publishes nothing.
          gh workflow run build-release.yml --ref main
          echo "dispatched build-release"
          # Every upstream commit gets its own branch name, so a run that dies
          # after pushing but before opening its PR leaves a branch that nothing
          # will ever look at again. scripts/prune-luci-branches.sh removes those
          # and only those; see its header for the policy.
          scripts/prune-luci-branches.sh --keep "$branch"
